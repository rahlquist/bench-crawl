# Copy this file to config.toml and edit it for your environment.
# config.toml is ignored by Git.

[default]
base_url = "http://localhost:8080/v1"
api_key = ""
model = "your-model-id"
timeout_s = 7200
results_dir = "results"

[default.env]
OPENAI_API_KEY = ""
OPENAI_BASE_URL = "http://localhost:8080/v1"
OPENAI_API_BASE = "http://localhost:8080/v1"

[benchmarks.mmlu]
enabled = true
tasks = "mmlu"
num_fewshot = 5
subset = ""
batch_size = 1
dtype = "bfloat16"
# Required for MMLU log-likelihood scoring.
tokenizer = ""

[benchmarks.livecodebench]
enabled = true
release = "release_v2"
scenario = "codegeneration"
evaluate = true
repo = ""

[benchmarks.deepswe]
enabled = false
tasks_dir = "deep-swe/tasks"
agent = "mini-swe-agent"
model = ""
n_tasks = 0
sample_seed = 0

[benchmarks.terminalbench]
enabled = false
dataset = "terminal-bench/terminal-bench@latest"
agent = "terminus"
model = ""
n_concurrent = 1
task = ""

[benchmarks.swebench_pro]
enabled = false
repo = "SWE-bench_Pro-os"
subset = "public"
num_instances = 0
max_workers = 4
model = ""

[benchmarks.taubench]
enabled = false
repo = "tau-bench"
env = "banking"
agent_strategy = "tool-calling"
user_strategy = "llm"
model = ""
max_concurrency = 2

[benchmarks.foodtruck]
enabled = false
contact_email = "contact@foodtruckbench.com"
submission_dir = "results/foodtruck"
