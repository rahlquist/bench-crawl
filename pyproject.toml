[project]
name = "benchsuite"
version = "0.1.0"
description = "Stand-alone orchestrator that drives multiple model benchmark harnesses against one OpenAI-compatible endpoint."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
benchsuite = "benchsuite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchsuite"]
